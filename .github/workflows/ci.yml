# CI: typecheck-free JS, but we do build both apps and run a live scraper
# smoke test against INE's mock store (the target we are explicitly allowed to
# scrape). Keeps the extraction logic honest on every push.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install deps (includes Chromium)
        run: npm ci
      - name: Scraper smoke test (headless, 1 product)
        run: node src/jobs/runScrape.js --adhoc --id 2457 --option "Single"
        env:
          SCRAPE_RETRIES: 3
      - name: Boot server + hit health
        run: |
          PORT=8080 node src/server.js & sleep 4
          curl -fsS http://localhost:8080/health

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
